name: Website

# Deploys site/ to GitHub Pages (holdtospeak.com). The site reuses the README's captured overlay
# images and the app icon, so they are copied in at build time rather than duplicated in git.

on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/readme/**', 'assets/HoldToSpeak.ico', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp assets/readme/*.png assets/readme/*.svg _site/assets/
          cp assets/HoldToSpeak.ico _site/favicon.ico
          python3 - <<'EOF'
          # icon.png: the 256 px PNG entry inside HoldToSpeak.ico (no Pillow on the runner needed)
          import struct
          b = open('assets/HoldToSpeak.ico', 'rb').read()
          n = struct.unpack('<HHH', b[:6])[2]
          for i in range(n):
              w, h, cc, res, planes, bpp, size, off = struct.unpack('<BBBBHHII', b[6 + 16 * i:22 + 16 * i])
              blob = b[off:off + size]
              if blob[:8] == b'\x89PNG\r\n\x1a\n':
                  open('_site/assets/icon.png', 'wb').write(blob)
                  break
          EOF
          test -f _site/assets/icon.png
          echo "holdtospeak.com" > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
