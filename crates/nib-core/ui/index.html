<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoldToSpeak — Settings</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="win">
  <aside class="side">
    <div class="brand"><img src="icon.png" alt="" width="20" height="20"><span>HoldToSpeak</span><span class="dim">Settings</span></div>
    <nav class="nav" id="nav">
      <a class="nav-item" data-page="general" href="#general">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10" cy="4.5" r="1.6"/><circle cx="5" cy="11.5" r="1.6"/></svg><span>General</span></a>
      <a class="nav-item" data-page="overlay" href="#overlay">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5l1.5-1.5h8l1.5 1.5v5l-1.5 1.5h-8l-1.5-1.5z"/><path d="M4.5 8h1.2l1-2 1.4 4 1.2-2h2.2"/></svg><span>Overlay</span></a>
      <a class="nav-item" data-page="microphone" href="#microphone">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="5.5" y="1.8" width="5" height="8" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2M5.8 14.5h4.4"/></svg><span>Microphone</span></a>
      <a class="nav-item" data-page="dictionary" href="#dictionary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.2h4.2a1.8 1.8 0 0 1 1.3.6 1.8 1.8 0 0 1 1.3-.6h4.2v9.3H9.3a1.3 1.3 0 0 0-1.3.7 1.3 1.3 0 0 0-1.3-.7H2.5z"/><path d="M8 3.8v8.9"/></svg><span>Dictionary &amp; apps</span></a>
      <a class="nav-item" data-page="privacy" href="#privacy">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8l5 1.8v4c0 3-2.2 5.3-5 6.6-2.8-1.3-5-3.6-5-6.6v-4z"/><path d="M5.8 8l1.6 1.6L10.4 6.4"/></svg><span>Privacy</span></a>
      <a class="nav-item" data-page="model" href="#model">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/><rect x="6.2" y="6.2" width="3.6" height="3.6"/><path d="M6 1.2v2.3M10 1.2v2.3M6 12.5v2.3M10 12.5v2.3M1.2 6h2.3M1.2 10h2.3M12.5 6h2.3M12.5 10h2.3"/></svg><span>Speech model</span></a>
      <a class="nav-item" data-page="diagnostics" href="#diagnostics">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8.5h2.6l1.6-4.5 2.4 8 1.8-5 1 1.5h3.6"/></svg><span>Diagnostics</span></a>
      <a class="nav-item" data-page="about" href="#about">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6.3"/><path d="M8 7.2v4M8 4.9v.2"/></svg><span>About</span></a>
    </nav>
    <div class="status" id="status">
      <div class="st-row mono"><span class="dot dot-green"></span><span>HOTKEYS ACTIVE</span></div>
      <div class="st-sub" id="st-ptt">Hold Ctrl + Win to dictate</div>
      <div class="st-row mono" style="margin-top: 10px;"><span class="dot dot-cyan"></span><span id="st-mode">MODE · AUTO</span></div>
      <div class="st-sub" id="st-version"></div>
    </div>
  </aside>
  <main class="content" id="content">
    <div class="page-h"><h1>Loading…</h1></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js" defer></script>
</body>
</html>
